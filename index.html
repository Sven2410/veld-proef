<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veld-proef</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icoon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veld-proef">
<meta name="theme-color" content="#0C0C0A">
<link rel="stylesheet" href="stijl.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"
        integrity="sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu"
        crossorigin="anonymous"></script>
<script src="gedeeld.js"></script>
<style>
  .keuzes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .keuzes button { margin: 0; padding: 7px 11px; font-size: 14px; font-weight: 500; background: var(--rand); color: var(--inkt); }
  .scan { position: fixed; inset: 0; background: #000; display: grid; place-items: center; z-index: 9; }
  .scan video { width: 100%; max-height: 80vh; object-fit: cover; }
  .scan button { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 16px; right: 16px; }
  .scan p { position: absolute; top: max(24px, env(safe-area-inset-top)); left: 16px; right: 16px; text-align: center; }
</style>
</head>
<body>
<main>
  <header><h1>Veld-proef</h1><span id="stand" class="pil"></span></header>

  <section>
    <h2>Pc</h2>
    <div id="koppeling"></div>
  </section>

  <section>
    <h2>Testrapport</h2>
    <form id="rapport">
      <label for="klant">Klant</label>
      <input id="klant" list="klantenlijst" required autocomplete="off" placeholder="Naam van de klant">
      <datalist id="klantenlijst"></datalist>
      <div id="klantknoppen" class="keuzes"></div>
      <label for="opmerking">Opmerking</label>
      <textarea id="opmerking" placeholder="Wat je ter plekke zag"></textarea>
      <label for="foto">Foto (mag leeg)</label>
      <input id="foto" type="file" accept="image/*">
      <button type="submit">Afronden</button>
    </form>
    <p class="zacht">Afronden bewaart het op de telefoon, ook zonder internet. Versturen gaat vanzelf zodra er
      internet is en de pc aan staat met het programma open.</p>
  </section>

  <section>
    <h2>Op de telefoon</h2>
    <ul id="wachtrij"></ul>
    <div class="rij">
      <button id="verstuur">Nu versturen</button>
      <button id="opruimen" class="tweede">Verstuurde weghalen</button>
    </div>
  </section>

  <section>
    <h2>Logboek</h2>
    <ul id="log"></ul>
  </section>
</main>

<script>
const log = maakLogboek("veld.log", $("#log"));
const koppeling = () => leesKoppelcode(localStorage.getItem("veld.koppeling"));

// --- koppelen ------------------------------------------------------------------

// Een QR-code gescand met de camera van de telefoon opent deze pagina met de
// code achter het hekje: dat deel gaat nooit naar een server.
function koppel(code, hoe) {
  const k = leesKoppelcode(code);
  if (!k) {
    log("Dat is geen koppelcode van de pc.", true);
    return false;
  }
  localStorage.setItem("veld.koppeling", k.code);
  localStorage.setItem("veld.gekoppeld", String(Date.now()));
  log(`Gekoppeld met de pc (${hoe})`);
  toonKoppeling();
  verstuur(true);
  return true;
}

function toonKoppeling() {
  const k = koppeling();
  const vak = $("#koppeling");
  if (k) {
    vak.innerHTML = `<p class="zacht"></p><div class="rij"><button class="gevaar" type="button">Ontkoppelen</button></div>`;
    vak.querySelector("p").textContent =
      `Gekoppeld met pc …${k.pc.slice(-6)}, sinds ${tijd(Number(localStorage.getItem("veld.gekoppeld")))}.`;
    vak.querySelector("button").onclick = () => {
      localStorage.removeItem("veld.koppeling");
      log("Ontkoppeld");
      toonKoppeling();
    };
  } else {
    vak.innerHTML = `<p class="zacht">Nog niet gekoppeld. Open op de pc de pc-pagina en scan de QR-code die daar
      staat.</p><button type="button" id="scan">QR-code scannen</button>
      <label for="code">Of plak de koppelcode</label><div class="rij"><input id="code" autocomplete="off">
      <button type="button" class="tweede" id="plak">Koppelen</button></div>`;
    $("#scan").onclick = scan;
    $("#plak").onclick = () => koppel($("#code").value, "koppelcode");
  }
  toonStand();
}

// De QR-code scannen in de pagina zelf. Nodig voor de beginschermapp op een
// iPhone: die heeft eigen opslag, en een link uit de camera opent Safari.
// Zoals de veld-app van DomotiOffice het doet, met jsQR.
async function scan() {
  const laag = document.createElement("div");
  laag.className = "scan";
  laag.innerHTML = `<p>Richt de camera op de QR-code op de pc</p><video playsinline muted></video>
    <button type="button" class="tweede">Stoppen</button>`;
  document.body.append(laag);
  let stroom = null;
  const stop = () => { stroom?.getTracks().forEach((t) => t.stop()); laag.remove(); };
  laag.querySelector("button").onclick = stop;
  try {
    if (!window.jsQR) {
      await new Promise((ok, nee) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
        s.integrity = "sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx";
        s.crossOrigin = "anonymous";
        s.onload = ok;
        s.onerror = () => nee(new Error("de scanner laadde niet (internet?)"));
        document.head.append(s);
      });
    }
    stroom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    const video = laag.querySelector("video");
    video.srcObject = stroom;
    await video.play();
    const doek = document.createElement("canvas");
    const ctx = doek.getContext("2d", { willReadFrequently: true });
    const kijk = () => {
      if (!laag.isConnected) return;
      if (video.videoWidth) {
        const schaal = Math.min(1, 720 / video.videoWidth);
        doek.width = Math.round(video.videoWidth * schaal);
        doek.height = Math.round(video.videoHeight * schaal);
        ctx.drawImage(video, 0, 0, doek.width, doek.height);
        const beeld = ctx.getImageData(0, 0, doek.width, doek.height);
        const gevonden = jsQR(beeld.data, beeld.width, beeld.height, { inversionAttempts: "dontInvert" });
        const code = gevonden && new URLSearchParams(gevonden.data.split("#")[1] || "").get("koppel");
        if (code && leesKoppelcode(code)) {
          stop();
          koppel(code, "QR-code in de app");
          return;
        }
      }
      requestAnimationFrame(kijk);
    };
    kijk();
  } catch (e) {
    stop();
    log(`Scannen lukte niet: ${e.message}. Plak dan de koppelcode.`, true);
  }
}

// --- de rapporten op de telefoon (IndexedDB, want daar passen foto's in) -------

function db() {
  return new Promise((ok, nee) => {
    const r = indexedDB.open("veld", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("rapporten", { keyPath: "id" });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => nee(r.error);
  });
}

async function opslag(modus, doe) {
  const d = await db();
  return new Promise((ok, nee) => {
    const tx = d.transaction("rapporten", modus);
    const vraag = doe(tx.objectStore("rapporten"));
    tx.oncomplete = () => ok(vraag.result);
    tx.onerror = () => nee(tx.error);
  });
}
const alle = () => opslag("readonly", (s) => s.getAll());
const bewaar = (r) => opslag("readwrite", (s) => s.put(r));
const weg = (id) => opslag("readwrite", (s) => s.delete(id));

async function toonWachtrij() {
  const lijst = (await alle()).sort((a, b) => b.gemaakt - a.gemaakt);
  $("#wachtrij").replaceChildren(...(lijst.length ? lijst.map((r) => {
    const li = document.createElement("li");
    li.textContent = `${r.klant}${r.foto ? " (met foto)" : ""}`;
    const s = document.createElement("span");
    s.className = `stand ${r.stand}`;
    s.textContent = r.stand === "klaar" ? "wacht op versturen" : `verstuurd ${tijd(r.verstuurd)}`;
    li.append(s);
    return li;
  }) : [Object.assign(document.createElement("li"), { className: "zacht", textContent: "Nog niets." })]));
  const wacht = lijst.filter((r) => r.stand === "klaar").length;
  $("#verstuur").textContent = wacht ? `Nu versturen (${wacht})` : "Verbinden met de pc";
  if ("setAppBadge" in navigator) navigator.setAppBadge(wacht).catch(() => {});
}

// Een foto van een telefoon is al snel 3 tot 5 MB. Kleiner maken scheelt op
// 4G; lukt dat niet, dan gaat het origineel.
async function verklein(bestand) {
  try {
    const beeld = await createImageBitmap(bestand);
    const schaal = Math.min(1, 1600 / Math.max(beeld.width, beeld.height));
    const c = document.createElement("canvas");
    c.width = Math.round(beeld.width * schaal);
    c.height = Math.round(beeld.height * schaal);
    c.getContext("2d").drawImage(beeld, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob((b) => ok(b || bestand), "image/jpeg", 0.82));
  } catch {
    return bestand;
  }
}

// --- de verbinding met de pc -------------------------------------------------------

async function verbind() {
  const k = koppeling();
  const sleutel = await maakSleutel(k.sleutel);
  const peer = new Peer(VERBINDING);
  try {
    await new Promise((ok, nee) => {
      peer.once("open", ok);
      peer.once("error", nee);
      setTimeout(() => nee(new Error("Het makelaartje antwoordt niet.")), 15000);
    });
    const conn = peer.connect(k.pc, { reliable: true });
    await new Promise((ok, nee) => {
      conn.once("open", ok);
      peer.on("error", (e) => nee(e.type === "peer-unavailable"
        ? new Error("De pc is niet bereikbaar. Staat hij aan, met het programma open?") : e));
      setTimeout(() => nee(new Error("Geen directe verbinding met de pc via dit netwerk (vaak op 4G). "
        + "Het gaat vanzelf zodra je op dezelfde wifi zit als de pc.")), 20000);
    });
    // De klantenlijst komt mee bij elke verbinding, vóór het welkom. Eerst
    // die verwerken en dan pas verder, zodat hij er zeker staat als de
    // verbinding daarna meteen weer dichtgaat.
    const klanten = wachtOp(conn, (m) => m.soort === "klanten", 10000, "De pc stuurde geen klanten.");
    const welkom = wachtOp(conn, (m) => m.soort === "welkom", 10000,
      "De pc nam de telefoon niet aan. Is er op de pc een nieuwe koppeling gemaakt? Koppel dan opnieuw.");
    conn.send({ soort: "hallo", ...(await versleutel(sleutel, tekst.naar({ toestel: navigator.userAgent }))) });
    await welkom;
    try {
      const lijst = tekst.van(await ontsleutel(sleutel, await klanten));
      const oud = localStorage.getItem("veld.klanten");
      localStorage.setItem("veld.klanten", JSON.stringify(lijst));
      if (oud !== JSON.stringify(lijst)) log(`${lijst.length} klanten van de pc ontvangen`);
      toonKlanten();
    } catch (e) {
      log(`De klantenlijst kwam niet goed over: ${e.message || e}`, true);
    }
    return { peer, conn, sleutel };
  } catch (e) {
    peer.destroy();
    throw e;
  }
}

let bezig = false;
let vorigeFout = "";

async function verstuur(zelf = false) {
  if (bezig || !koppeling()) return;
  const wacht = (await alle()).filter((r) => r.stand === "klaar");
  if (!wacht.length && !zelf) return;
  if (!navigator.onLine) {
    if (zelf) log("Geen internet. Het blijft op de telefoon en gaat vanzelf zodra er internet is.");
    return;
  }
  bezig = true;
  toonStand("verbinden…");
  let v = null;
  try {
    v = await verbind();
    for (const r of wacht) {
      const inhoud = { id: r.id, klant: r.klant, opmerking: r.opmerking, gemaakt: r.gemaakt,
        verstuurd: Date.now(), foto: !!r.foto };
      const bericht = { soort: "rapport", ...(await versleutel(v.sleutel, tekst.naar(inhoud))) };
      if (r.foto) {
        const f = await versleutel(v.sleutel, await r.foto.arrayBuffer());
        bericht.fotoIv = f.iv;
        bericht.foto = f.data;
      }
      // Pas als de pc zegt dat hij het bewaard heeft, staat het als verstuurd.
      const bevestigd = wachtOp(v.conn, (m) => m.soort === "ontvangen" && m.id === r.id, 60000,
        "De pc bevestigde niet binnen een minuut. Het blijft op de telefoon.");
      v.conn.send(bericht);
      await bevestigd;
      r.stand = "verstuurd";
      r.verstuurd = Date.now();
      await bewaar(r);
      log(`Verstuurd: ${r.klant}${r.foto ? " met foto" : ""}`);
    }
    if (!wacht.length) log("Verbonden met de pc; klanten bijgewerkt.");
    vorigeFout = "";
  } catch (e) {
    // Elke halve minuut opnieuw proberen, maar niet elke keer dezelfde regel.
    const melding = e.message || String(e);
    if (melding !== vorigeFout || zelf) log(melding, true);
    vorigeFout = melding;
  } finally {
    if (v) {
      v.conn.close();
      v.peer.destroy();
    }
    bezig = false;
    toonStand();
    toonWachtrij();
  }
}

// De klanten van de pc als knoppen onder het veld. Het keuzelijstje van het
// veld zelf toont een iPhone pas na een tik, als suggestie boven het
// toetsenbord, en dan zie je niet dat ze er zijn.
function toonKlanten() {
  const lijst = JSON.parse(localStorage.getItem("veld.klanten") || "[]");
  $("#klantenlijst").replaceChildren(...lijst.map((naam) => Object.assign(document.createElement("option"), { value: naam })));
  $("#klantknoppen").replaceChildren(...lijst.map((naam) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = naam;
    b.onclick = () => { $("#klant").value = naam; };
    return b;
  }));
}

function toonStand(bezigMet = "") {
  const s = $("#stand");
  s.className = "pil";
  if (bezigMet) {
    s.textContent = bezigMet;
  } else if (!navigator.onLine) {
    s.textContent = "geen internet";
    s.classList.add("let-op");
  } else if (!koppeling()) {
    s.textContent = "niet gekoppeld";
    s.classList.add("let-op");
  } else {
    s.textContent = vorigeFout ? "pc niet bereikt" : "gekoppeld";
    s.classList.add(vorigeFout ? "let-op" : "goed");
  }
}

// --- de knoppen ----------------------------------------------------------------

$("#rapport").onsubmit = async (e) => {
  e.preventDefault();
  const bestand = $("#foto").files[0];
  const klant = $("#klant").value.trim();
  await bewaar({
    id: crypto.randomUUID(), klant, opmerking: $("#opmerking").value.trim(),
    foto: bestand ? await verklein(bestand) : null, gemaakt: Date.now(), stand: "klaar",
  });
  log(`Afgerond: ${klant}${navigator.onLine ? "" : " (zonder internet)"}`);
  e.target.reset();
  await toonWachtrij();
  verstuur();
};
$("#verstuur").onclick = () => verstuur(true);
$("#opruimen").onclick = async () => {
  for (const r of await alle()) if (r.stand === "verstuurd") await weg(r.id);
  toonWachtrij();
};

addEventListener("online", () => { toonStand(); verstuur(); });
addEventListener("offline", () => toonStand());
document.addEventListener("visibilitychange", () => { if (!document.hidden) verstuur(); });
setInterval(verstuur, 30_000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

toonKoppeling();
toonKlanten();
toonWachtrij();

const uitHekje = new URLSearchParams(location.hash.slice(1)).get("koppel");
if (uitHekje) {
  history.replaceState(null, "", location.pathname);
  koppel(uitHekje, "QR-code met de camera");
} else {
  verstuur();
}
</script>
</body>
</html>
