<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneDrive-proef</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icoon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proef">
<meta name="theme-color" content="#0C0C0A">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous"></script>
<style>
  :root {
    --achter: #0c0c0a; --vlak: #1a1a17; --rand: #2c2b27; --inkt: #ece8e1; --zacht: #a29d94;
    --groen: #22a06b; --oranje: #f08c00; --rood: #e5484d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--achter); color: var(--inkt);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 21px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--zacht); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  section { background: var(--vlak); border: 1px solid var(--rand); border-radius: 14px; padding: 14px; }
  .net { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--rand); }
  .net.aan { background: color-mix(in srgb, var(--groen) 25%, transparent); }
  label { display: block; font-size: 14px; color: var(--zacht); margin: 10px 0 4px; }
  input, textarea, select {
    width: 100%; font: inherit; color: inherit; background: var(--achter);
    border: 1px solid var(--rand); border-radius: 10px; padding: 10px;
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 16px;
    background: var(--groen); color: #fff; margin-top: 12px; cursor: pointer;
  }
  button.tweede { background: var(--rand); color: var(--inkt); }
  button.let-op { background: var(--oranje); }
  button:disabled { opacity: .45; }
  .rij { display: flex; flex-wrap: wrap; gap: 8px; }
  .rij button { flex: 1 1 auto; }
  .zacht { color: var(--zacht); font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-top: 1px solid var(--rand); font-size: 14px; }
  li:first-child { border-top: 0; }
  .tijd { color: var(--zacht); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .stand { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--rand); margin-left: 6px; }
  .stand.klaar { background: color-mix(in srgb, var(--oranje) 30%, transparent); }
  .stand.verstuurd { background: color-mix(in srgb, var(--groen) 30%, transparent); }
  .fout { color: var(--rood); }
</style>
</head>
<body>
<main>
  <header><h1>OneDrive-proef</h1><span id="net" class="net"></span></header>

  <section>
    <h2>Microsoft</h2>
    <div id="account" class="zacht"></div>
    <div class="rij" id="inlogknoppen"></div>
  </section>

  <section>
    <h2>Testrapport</h2>
    <form id="rapport">
      <label for="klant">Klant</label>
      <input id="klant" list="klantenlijst" required autocomplete="off" placeholder="Naam van de klant">
      <datalist id="klantenlijst"></datalist>
      <label for="opmerking">Opmerking</label>
      <textarea id="opmerking" placeholder="Wat je ter plekke zag"></textarea>
      <label for="foto">Foto (mag leeg)</label>
      <input id="foto" type="file" accept="image/*">
      <button type="submit">Afronden</button>
    </form>
    <p class="zacht">Afronden bewaart het op de telefoon, ook zonder internet. Versturen gaat vanzelf zodra er
      internet is en je ingelogd bent.</p>
  </section>

  <section>
    <h2>Op de telefoon</h2>
    <ul id="wachtrij"></ul>
    <div class="rij">
      <button id="verstuur">Nu versturen</button>
      <button id="opruimen" class="tweede">Verstuurde weghalen</button>
    </div>
  </section>

  <section>
    <h2>Klanten van de pc</h2>
    <p class="zacht" id="klanten-stand"></p>
    <button id="klanten" class="tweede">Klanten ophalen</button>
  </section>

  <section>
    <h2>Logboek</h2>
    <p class="zacht">Hieraan zien we na een dag of het inloggen bleef staan.</p>
    <ul id="log"></ul>
  </section>
</main>

<script>
// Het Application (client) ID uit het Microsoft-portaal. Geen geheim: elke
// pagina die met Microsoft inlogt toont het in de adresbalk.
const CLIENT_ID = "VUL-HIER-IN";
const SCOPES = ["Files.ReadWrite.AppFolder"];
// De eigen map van de app in OneDrive (Apps/<naam van de app>). De app kan
// alleen daar bij, niet in de rest van de OneDrive.
const MAP = "https://graph.microsoft.com/v1.0/me/drive/special/approot";

const $ = (s) => document.querySelector(s);
const uur = (t) => new Date(t).toLocaleString("nl-NL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

// --- logboek -------------------------------------------------------------------

function log(tekst, fout = false) {
  const l = JSON.parse(localStorage.getItem("proef.log") || "[]");
  l.unshift({ t: Date.now(), tekst, fout });
  localStorage.setItem("proef.log", JSON.stringify(l.slice(0, 300)));
  toonLog();
}

function toonLog() {
  const l = JSON.parse(localStorage.getItem("proef.log") || "[]");
  $("#log").replaceChildren(...l.slice(0, 60).map((r) => {
    const li = document.createElement("li");
    if (r.fout) li.className = "fout";
    li.innerHTML = `<span class="tijd"></span>`;
    li.firstChild.textContent = uur(r.t);
    li.append(r.tekst);
    return li;
  }));
}

// --- de wachtrij op de telefoon (IndexedDB, want daar passen foto's in) ---------

function db() {
  return new Promise((ok, nee) => {
    const r = indexedDB.open("proef", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("rapporten", { keyPath: "id" });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => nee(r.error);
  });
}

async function opslag(modus, doe) {
  const d = await db();
  return new Promise((ok, nee) => {
    const tx = d.transaction("rapporten", modus);
    const vraag = doe(tx.objectStore("rapporten"));
    tx.oncomplete = () => ok(vraag.result);
    tx.onerror = () => nee(tx.error);
  });
}
const alle = () => opslag("readonly", (s) => s.getAll());
const bewaar = (r) => opslag("readwrite", (s) => s.put(r));
const weg = (id) => opslag("readwrite", (s) => s.delete(id));

async function toonWachtrij() {
  const lijst = (await alle()).sort((a, b) => b.gemaakt - a.gemaakt);
  $("#wachtrij").replaceChildren(...(lijst.length ? lijst.map((r) => {
    const li = document.createElement("li");
    li.textContent = `${r.klant}${r.foto ? " (met foto)" : ""}`;
    const s = document.createElement("span");
    s.className = `stand ${r.stand}`;
    s.textContent = r.stand === "klaar" ? "wacht op versturen" : `verstuurd ${uur(r.verstuurd)}`;
    li.append(s);
    return li;
  }) : [Object.assign(document.createElement("li"), { className: "zacht", textContent: "Nog niets." })]));
  const wacht = lijst.filter((r) => r.stand === "klaar").length;
  $("#verstuur").disabled = !wacht;
  $("#verstuur").textContent = wacht ? `Nu versturen (${wacht})` : "Nu versturen";
}

// Een foto van een telefoon is al snel 3 tot 5 MB. Kleiner maken scheelt op
// 4G; lukt dat niet, dan gaat het origineel.
async function verklein(bestand) {
  try {
    const beeld = await createImageBitmap(bestand);
    const schaal = Math.min(1, 1600 / Math.max(beeld.width, beeld.height));
    const c = document.createElement("canvas");
    c.width = Math.round(beeld.width * schaal);
    c.height = Math.round(beeld.height * schaal);
    c.getContext("2d").drawImage(beeld, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob((b) => ok(b || bestand), "image/jpeg", 0.82));
  } catch {
    return bestand;
  }
}

// --- inloggen bij Microsoft ----------------------------------------------------

let app = null;
let account = null;
let opnieuw = false;      // Microsoft wil dat je opnieuw inlogt

async function startInloggen() {
  if (!window.msal) {
    log("De inlogbibliotheek laadde niet. Eén keer met internet openen.", true);
  } else if (CLIENT_ID.startsWith("VUL")) {
    log("Nog geen client ID ingevuld.", true);
  } else {
    app = new msal.PublicClientApplication({
      auth: {
        clientId: CLIENT_ID,
        authority: "https://login.microsoftonline.com/common",
        redirectUri: location.origin + location.pathname,
        navigateToLoginRequestUrl: false,
      },
      cache: { cacheLocation: "localStorage" },
    });
    await app.initialize();
    try {
      const r = await app.handleRedirectPromise();
      if (r) {
        account = r.account;
        opnieuw = false;
        localStorage.setItem("proef.ingelogd", String(Date.now()));
        log(`Ingelogd als ${r.account.username}`);
      }
    } catch (e) {
      log(`Inloggen lukte niet: ${e.errorCode || e.message}`, true);
    }
    account = account || app.getAllAccounts()[0] || null;
    if (account) app.setActiveAccount(account);
  }
  toonAccount();
}

function sindsInloggen() {
  const t = Number(localStorage.getItem("proef.ingelogd") || 0);
  return t ? `${((Date.now() - t) / 36e5).toFixed(1)} uur` : "onbekend";
}

function toonAccount() {
  const knoppen = [];
  if (!app) {
    $("#account").textContent = "Inloggen kan nog niet.";
  } else if (!account) {
    $("#account").textContent = "Niet ingelogd.";
    knoppen.push(knop("Inloggen", () => app.loginRedirect({ scopes: SCOPES })));
    knoppen.push(knop("Inloggen in een venster", inloggenVenster, "tweede"));
  } else {
    $("#account").textContent = `${account.username}. Laatst echt ingelogd: ${sindsInloggen()} geleden.`;
    if (opnieuw) {
      knoppen.push(knop("Opnieuw inloggen om te versturen",
        () => app.acquireTokenRedirect({ scopes: SCOPES, account }), "let-op"));
      knoppen.push(knop("In een venster", inloggenVenster, "tweede"));
    }
    knoppen.push(knop("Uitloggen", async () => {
      await app.logoutRedirect({ account, postLogoutRedirectUri: location.origin + location.pathname });
    }, "tweede"));
  }
  $("#inlogknoppen").replaceChildren(...knoppen);
}

function knop(tekst, doe, soort = "") {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = tekst;
  if (soort) b.className = soort;
  b.onclick = doe;
  return b;
}

// Op een iPhone-beginschermapp kan het doorsturen naar Microsoft en terug
// anders lopen dan in Safari; daarom ook een venster, om te vergelijken.
async function inloggenVenster() {
  try {
    const r = await app.acquireTokenPopup({ scopes: SCOPES, account: account || undefined });
    account = r.account;
    app.setActiveAccount(account);
    opnieuw = false;
    localStorage.setItem("proef.ingelogd", String(Date.now()));
    log(`Ingelogd (venster) als ${account.username}`);
    toonAccount();
    verstuur();
  } catch (e) {
    log(`Inloggen in een venster lukte niet: ${e.errorCode || e.message}`, true);
  }
}

async function toegang() {
  if (!app || !account) throw new Error("Niet ingelogd.");
  try {
    const r = await app.acquireTokenSilent({ scopes: SCOPES, account });
    if (!r.fromCache) log(`Toegang stil vernieuwd (${sindsInloggen()} na inloggen)`);
    return r.accessToken;
  } catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError || e.errorCode === "no_tokens_found") {
      if (!opnieuw) log(`Microsoft vraagt opnieuw in te loggen (${sindsInloggen()} na de vorige keer)`, true);
      opnieuw = true;
      toonAccount();
      throw new Error("opnieuw inloggen");
    }
    throw e;
  }
}

async function onedrive(pad, opties = {}) {
  const t = await toegang();
  const r = await fetch(MAP + pad, { ...opties, headers: { Authorization: `Bearer ${t}`, ...(opties.headers || {}) } });
  if (!r.ok) throw new Error(`OneDrive gaf ${r.status}: ${(await r.text()).slice(0, 160)}`);
  return r;
}

// --- versturen en ophalen --------------------------------------------------------

let bezig = false;

async function verstuur() {
  if (bezig || !navigator.onLine || !account) return;
  bezig = true;
  try {
    for (const r of (await alle()).filter((x) => x.stand === "klaar")) {
      // Eerst de foto en dan het rapport: de pc ziet het rapport pas als de
      // foto er al staat.
      if (r.foto) {
        await onedrive(`:/inbox/${r.id}.jpg:/content`, {
          method: "PUT", headers: { "Content-Type": "image/jpeg" }, body: r.foto,
        });
      }
      const inhoud = { id: r.id, klant: r.klant, opmerking: r.opmerking, gemaakt: new Date(r.gemaakt).toISOString(),
        foto: r.foto ? `${r.id}.jpg` : null, verstuurd: new Date().toISOString(), toestel: navigator.userAgent };
      await onedrive(`:/inbox/${r.id}.json:/content`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(inhoud, null, 1),
      });
      r.stand = "verstuurd";
      r.verstuurd = Date.now();
      await bewaar(r);
      log(`Verstuurd: ${r.klant}`);
    }
  } catch (e) {
    if (e.message !== "opnieuw inloggen") log(`Versturen lukte niet: ${e.message}`, true);
  } finally {
    bezig = false;
    toonWachtrij();
  }
}

async function haalKlanten() {
  try {
    // Het bestand zelf via de downloadlink: een gewone /content geeft een
    // doorverwijzing die een browser niet mag volgen (CORS).
    const info = await (await onedrive(":/klanten.json")).json();
    const lijst = await (await fetch(info["@microsoft.graph.downloadUrl"])).json();
    localStorage.setItem("proef.klanten", JSON.stringify({ t: Date.now(), lijst }));
    log(`${lijst.length} klanten opgehaald`);
  } catch (e) {
    if (e.message.includes("404")) log("Er staat nog geen klantenlijst. Draai op de pc: python pc.py klanten", true);
    else if (e.message !== "opnieuw inloggen") log(`Klanten ophalen lukte niet: ${e.message}`, true);
  }
  toonKlanten();
}

function toonKlanten() {
  const k = JSON.parse(localStorage.getItem("proef.klanten") || "null");
  $("#klanten-stand").textContent = k ? `${k.lijst.length} klanten, opgehaald ${uur(k.t)}. Ze staan bij Klant.`
    : "Nog geen klanten opgehaald.";
  $("#klantenlijst").replaceChildren(...(k ? k.lijst : []).map((x) => Object.assign(document.createElement("option"),
    { value: x.naam })));
}

// --- de knoppen ----------------------------------------------------------------

$("#rapport").onsubmit = async (e) => {
  e.preventDefault();
  const bestand = $("#foto").files[0];
  await bewaar({
    id: crypto.randomUUID(), klant: $("#klant").value.trim(), opmerking: $("#opmerking").value.trim(),
    foto: bestand ? await verklein(bestand) : null, gemaakt: Date.now(), stand: "klaar",
  });
  log(`Afgerond: ${$("#klant").value.trim()}${navigator.onLine ? "" : " (zonder internet)"}`);
  e.target.reset();
  await toonWachtrij();
  verstuur();
};
$("#verstuur").onclick = verstuur;
$("#opruimen").onclick = async () => {
  for (const r of await alle()) if (r.stand === "verstuurd") await weg(r.id);
  toonWachtrij();
};
$("#klanten").onclick = haalKlanten;

function toonNet() {
  $("#net").textContent = navigator.onLine ? "internet" : "geen internet";
  $("#net").classList.toggle("aan", navigator.onLine);
}
addEventListener("online", () => { toonNet(); verstuur(); });
addEventListener("offline", toonNet);
setInterval(verstuur, 60_000);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

toonNet();
toonLog();
toonKlanten();
toonWachtrij();
startInloggen().then(verstuur);
</script>
</body>
</html>
